<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>වාහන ලෝකය - Vehicle World</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    font-family: 'Nunito', sans-serif;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    min-height: 100vh;
    overflow-x: hidden;
  }

  .stars {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
  }

  .star {
    position: absolute;
    background: white;
    border-radius: 50%;
    animation: twinkle 3s infinite alternate;
  }

  @keyframes twinkle {
    from { opacity: 0.2; transform: scale(1); }
    to { opacity: 1; transform: scale(1.5); }
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 480px;
    margin: 0 auto;
    padding: 20px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .header {
    text-align: center;
    padding: 30px 0 20px;
    animation: slideDown 0.8s ease-out;
  }

  @keyframes slideDown {
    from { opacity: 0; transform: translateY(-30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .logo-emoji {
    font-size: 80px;
    display: block;
    animation: bounce 2s infinite;
    filter: drop-shadow(0 0 20px rgba(255,200,0,0.6));
  }

  @keyframes bounce {
    0%, 100% { transform: translateY(0) rotate(-5deg); }
    50% { transform: translateY(-15px) rotate(5deg); }
  }

  h1 {
    font-family: 'Fredoka One', cursive;
    font-size: 2.8em;
    background: linear-gradient(90deg, #FFD700, #FF6B35, #FF1744, #E040FB, #40C4FF);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-shadow: none;
    line-height: 1.1;
    margin: 10px 0 5px;
  }

  .subtitle {
    color: rgba(255,255,255,0.7);
    font-size: 0.95em;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .grade-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
    width: 100%;
    margin-top: 20px;
  }

  .grade-card {
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(10px);
    border: 2px solid rgba(255,255,255,0.15);
    border-radius: 24px;
    padding: 20px 15px;
    text-align: center;
    cursor: pointer;
    text-decoration: none;
    transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    animation: fadeInUp 0.6s ease-out both;
    position: relative;
    overflow: hidden;
  }

  .grade-card::before {
    content: '';
    position: absolute;
    top: -50%; left: -50%;
    width: 200%; height: 200%;
    background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 60%);
    opacity: 0;
    transition: opacity 0.3s;
  }

  .grade-card:hover::before { opacity: 1; }

  .grade-card:nth-child(1) { animation-delay: 0.1s; background: linear-gradient(135deg, rgba(255,107,53,0.3), rgba(255,23,68,0.2)); border-color: rgba(255,107,53,0.4); }
  .grade-card:nth-child(2) { animation-delay: 0.2s; background: linear-gradient(135deg, rgba(64,196,255,0.3), rgba(0,176,255,0.2)); border-color: rgba(64,196,255,0.4); }
  .grade-card:nth-child(3) { animation-delay: 0.3s; background: linear-gradient(135deg, rgba(105,240,174,0.3), rgba(0,200,83,0.2)); border-color: rgba(105,240,174,0.4); }
  .grade-card:nth-child(4) { animation-delay: 0.4s; background: linear-gradient(135deg, rgba(255,215,0,0.3), rgba(255,160,0,0.2)); border-color: rgba(255,215,0,0.4); }
  .grade-card:nth-child(5) { animation-delay: 0.5s; background: linear-gradient(135deg, rgba(224,64,251,0.3), rgba(156,39,176,0.2)); border-color: rgba(224,64,251,0.4); }
  .grade-card:nth-child(6) { animation-delay: 0.6s; background: linear-gradient(135deg, rgba(255,255,255,0.2), rgba(200,200,255,0.1)); border-color: rgba(255,255,255,0.3); grid-column: 1 / -1; }

  .grade-card:hover {
    transform: translateY(-8px) scale(1.03);
    box-shadow: 0 20px 40px rgba(0,0,0,0.4);
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .card-emoji {
    font-size: 50px;
    display: block;
    margin-bottom: 8px;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
  }

  .card-grade {
    font-family: 'Fredoka One', cursive;
    font-size: 1.3em;
    color: white;
    display: block;
    text-shadow: 0 2px 4px rgba(0,0,0,0.3);
  }

  .card-desc {
    font-size: 0.75em;
    color: rgba(255,255,255,0.7);
    font-weight: 600;
    margin-top: 4px;
    display: block;
  }

  .footer {
    margin-top: 30px;
    text-align: center;
    color: rgba(255,255,255,0.4);
    font-size: 0.8em;
    padding-bottom: 20px;
  }

  .floating-vehicles {
    position: fixed;
    pointer-events: none;
    z-index: 0;
    width: 100%;
    height: 100%;
    top: 0; left: 0;
    overflow: hidden;
  }

  .float-v {
    position: absolute;
    font-size: 2em;
    animation: floatAcross linear infinite;
    opacity: 0.15;
  }

  @keyframes floatAcross {
    from { transform: translateX(-100px); }
    to { transform: translateX(calc(100vw + 100px)); }
  }
</style>
</head>
<body>

<div class="floating-vehicles">
  <div class="float-v" style="top:10%;animation-duration:15s;animation-delay:-2s;">🚗</div>
  <div class="float-v" style="top:30%;animation-duration:20s;animation-delay:-7s;font-size:1.5em;">✈️</div>
  <div class="float-v" style="top:60%;animation-duration:18s;animation-delay:-4s;">🚂</div>
  <div class="float-v" style="top:80%;animation-duration:22s;animation-delay:-10s;font-size:1.5em;">⛵</div>
  <div class="float-v" style="top:45%;animation-duration:25s;animation-delay:-15s;">🚁</div>
</div>

<div class="stars" id="stars"></div>

<div class="container">
  <div class="header">
    <span class="logo-emoji">🚀</span>
    <h1>වාහන ලෝකය</h1>
    <p class="subtitle">Vehicle World · ශ්‍රේණිය තෝරන්න</p>
  </div>

  <div class="grade-grid">
    <a href="preschool.html" class="grade-card">
      <span class="card-emoji">🍼</span>
      <span class="card-grade">පෙර පාසල්</span>
      <span class="card-desc">Pre School</span>
    </a>
    <a href="grade1.html" class="grade-card">
      <span class="card-emoji">⭐</span>
      <span class="card-grade">1 ශ්‍රේණිය</span>
      <span class="card-desc">Grade 1</span>
    </a>
    <a href="grade2.html" class="grade-card">
      <span class="card-emoji">🌟</span>
      <span class="card-grade">2 ශ්‍රේණිය</span>
      <span class="card-desc">Grade 2</span>
    </a>
    <a href="grade3.html" class="grade-card">
      <span class="card-emoji">💫</span>
      <span class="card-grade">3 ශ්‍රේණිය</span>
      <span class="card-desc">Grade 3</span>
    </a>
    <a href="grade4.html" class="grade-card">
      <span class="card-emoji">🏆</span>
      <span class="card-grade">4 ශ්‍රේණිය</span>
      <span class="card-desc">Grade 4</span>
    </a>
    <a href="grade5.html" class="grade-card">
      <span class="card-emoji">🎓</span>
      <span class="card-grade">5 ශ්‍රේණිය</span>
      <span class="card-desc">Grade 5</span>
    </a>
  </div>

  <div class="footer">
    <p>🌈 ඉගෙනීම ආනන්දයක් කරගනිමු!</p>
  </div>
</div>

<script>
// Generate stars
const starsEl = document.getElementById('stars');
for (let i = 0; i < 80; i++) {
  const star = document.createElement('div');
  star.className = 'star';
  const size = Math.random() * 3 + 1;
  star.style.cssText = `
    width: ${size}px; height: ${size}px;
    top: ${Math.random()*100}%;
    left: ${Math.random()*100}%;
    animation-delay: ${Math.random()*3}s;
    animation-duration: ${Math.random()*3+2}s;
  `;
  starsEl.appendChild(star);
}
</script>
</body>
</html>
