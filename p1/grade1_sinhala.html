<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>සිංහල වචන</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#0d0618;font-family:'Segoe UI',Arial,sans-serif;min-height:100vh;display:flex;justify-content:center;}
.screen{width:100%;max-width:420px;min-height:100vh;display:flex;flex-direction:column;background:#0d0618;}
.sbar{background:#160824;padding:8px 16px;display:flex;justify-content:space-between;}
.sbar span{color:#6a4a8a;font-size:12px;}
.tab-row{display:grid;grid-template-columns:1fr 1fr 1fr;background:#160824;padding:6px 8px;gap:5px;}
.tab{border:none;border-radius:10px;padding:10px 0;font-size:12px;font-weight:bold;cursor:pointer;}
.tab.lrn{background:#1a1a3a;color:#a0a0f8;}
.tab.lrn.on{background:#2a2a8a;color:#d0d0ff;}
.tab.mch{background:#1a2a1a;color:#80e880;}
.tab.mch.on{background:#1a4a1a;color:#c0ffc0;}
.tab.qz{background:#2a1a1a;color:#f8a0a0;}
.tab.qz.on{background:#5a1a1a;color:#ffd0d0;}
.view{flex:1;padding:12px;display:flex;flex-direction:column;}
.prog-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.ptxt{font-size:12px;color:#6a4a8a;}
.pbar{flex:1;height:5px;background:#160824;border-radius:4px;margin:0 8px;overflow:hidden;}
.pfill{height:100%;background:#a084fc;border-radius:4px;transition:width .4s;}
.lcard{background:#160824;border-radius:22px;padding:18px 14px;margin-bottom:12px;text-align:center;border:2px solid #2a1a4a;min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.wem{font-size:60px;line-height:1;margin-bottom:8px;}
.wsi{font-size:54px;font-weight:bold;line-height:1.1;margin-bottom:6px;}
.wen{font-size:15px;color:#a084fc;margin-bottom:4px;font-style:italic;}
.wex{font-size:13px;color:#6a4a8a;margin-bottom:12px;}
.spkbtn{background:#2a1a4a;border:2px solid #5a3a8a;border-radius:50%;width:52px;height:52px;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;margin:0 auto;}
.nav-row{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin-bottom:8px;}
.nbtn{border:2px solid #2a1a4a;border-radius:12px;padding:12px 0;font-size:15px;font-weight:bold;cursor:pointer;background:#160824;color:#a084fc;}
.nbtn:disabled{opacity:.25;}
.nctr{text-align:center;}
.nnum{font-size:24px;font-weight:bold;color:#e8d4ff;}
.nof{font-size:11px;color:#6a4a8a;}
.dots{display:flex;justify-content:center;flex-wrap:wrap;gap:5px;}
.dot{width:14px;height:14px;border-radius:50%;background:#160824;border:1.5px solid #2a1a4a;cursor:pointer;}
.dot.seen{background:#2a2a8a;} .dot.cur{border-color:#a084fc;}
.srow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
.sc{background:#160824;border-radius:10px;padding:8px;text-align:center;}
.sc .sl{font-size:11px;color:#6a4a8a;}
.sc.g .sv{font-size:20px;font-weight:bold;color:#80e880;}
.sc.a .sv{font-size:20px;font-weight:bold;color:#f8d080;}
.pcard{background:#160824;border-radius:18px;padding:16px;margin-bottom:10px;text-align:center;border:2px solid #2a1a4a;min-height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;}
.pem{font-size:68px;line-height:1;margin-bottom:4px;}
.pprompt{font-size:13px;color:#6a4a8a;}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
.opt{border:2px solid #2a1a4a;border-radius:13px;padding:13px 4px;font-size:22px;font-weight:bold;cursor:pointer;background:#160824;color:#e8d4ff;text-align:center;}
.opt.correct{background:#0d2a1a;border-color:#4cc97a;color:#a8f0c0;}
.opt.wrong{background:#2a0d0d;border-color:#e24b4a;color:#f4a0a0;}
.opt.reveal{background:#0d2a1a;border-color:#4cc97a;color:#a8f0c0;}
.fb{border-radius:12px;padding:10px;text-align:center;font-size:14px;font-weight:bold;min-height:42px;display:flex;align-items:center;justify-content:center;margin-bottom:8px;}
.fb.good{background:#0d2a1a;color:#a8f0c0;}
.fb.bad{background:#2a0d0d;color:#f4a0a0;}
.fb.neu{background:#160824;color:#6a4a8a;}
.abtn{border:none;border-radius:12px;padding:13px;font-size:15px;font-weight:bold;cursor:pointer;width:100%;}
.abtn.pu{background:#a084fc;color:#0d0618;}
.abtn.rd{background:#f87171;color:#0d0618;}
.abtn:disabled{opacity:.25;cursor:default;}
.spark{position:absolute;font-size:20px;pointer-events:none;animation:sf .8s forwards;}
@keyframes sf{0%{opacity:1;transform:translateY(0)scale(1);}100%{opacity:0;transform:translateY(-70px)scale(.3);}}
</style>
</head>
<body>
<div class="screen">
  <div class="sbar"><span id="stime">9:41</span><span>සිංහල වචන 📚</span><span>🔋</span></div>
  <div class="tab-row">
    <button class="tab lrn on" id="t-lrn" onclick="showTab('lrn')">📖 කියවන්න</button>
    <button class="tab mch" id="t-mch" onclick="showTab('mch')">🖼️ ගැළපීම</button>
    <button class="tab qz" id="t-qz" onclick="showTab('qz')">🧠 Quiz</button>
  </div>

  <!-- LEARN -->
  <div class="view" id="v-lrn">
    <div class="prog-row">
      <span class="ptxt" id="plbl">1 / 15</span>
      <div class="pbar"><div class="pfill" id="pfill" style="width:7%"></div></div>
      <span class="ptxt" id="seenlbl">දුටු: 0</span>
    </div>
    <div class="lcard">
      <div class="wem" id="lem"></div>
      <div class="wsi" id="lsi"></div>
      <div class="wen" id="len"></div>
      <div class="wex" id="lex"></div>
      <button class="spkbtn" id="lspk" onclick="speakL()">🔊</button>
    </div>
    <div class="nav-row">
      <button class="nbtn" id="lprev" onclick="lNav(-1)" disabled>◀ පෙර</button>
      <div class="nctr"><div class="nnum" id="lidx">1</div><div class="nof">/ 15</div></div>
      <button class="nbtn" id="lnext" onclick="lNav(1)">ඊළඟ ▶</button>
    </div>
    <div class="dots" id="ldots"></div>
  </div>

  <!-- MATCH -->
  <div class="view" id="v-mch" style="display:none;">
    <div class="srow">
      <div class="sc g"><div class="sl">ලකුණු</div><div class="sv" id="msc">0</div></div>
      <div class="sc a"><div class="sl">වටය</div><div class="sv" id="mrnd">1/15</div></div>
    </div>
    <div class="pcard" id="mpcard">
      <div class="pem" id="mpic"></div>
      <div class="pprompt">පින්තූරයට ගැළපෙන වචනය තෝරන්න</div>
    </div>
    <div class="opts" id="mopts"></div>
    <div class="fb neu" id="mfb">පින්තූරය බලා වචනය තෝරන්න!</div>
    <button class="abtn pu" id="mnxt" disabled onclick="nextMatch()">ඊළඟ ➜</button>
  </div>

  <!-- QUIZ -->
  <div class="view" id="v-qz" style="display:none;">
    <div class="srow">
      <div class="sc g"><div class="sl">ලකුණු</div><div class="sv" id="qsc">0</div></div>
      <div class="sc a"><div class="sl">වටය</div><div class="sv" id="qrnd">1/15</div></div>
    </div>
    <div class="pcard" id="qcard">
      <div class="pem" id="qpic"></div>
      <div class="pprompt" id="qprompt"></div>
      <div style="font-size:34px;font-weight:bold;color:#e8d4ff;" id="qword"></div>
    </div>
    <div class="opts" id="qopts"></div>
    <div class="fb neu" id="qfb">නිවැරදි පිළිතුර තෝරන්න!</div>
    <button class="abtn rd" id="qnxt" disabled onclick="nextQuiz()">ඊළඟ ➜</button>
  </div>
</div>

<script>
var W=[
  {si:'නහය',en:'Nose',em:'👃',ex:'ශරීරයේ කොටසකි',clr:'#f9a8d4'},
  {si:'කන',en:'Ear',em:'👂',ex:'ශරීරයේ කොටසකි',clr:'#fbbf24'},
  {si:'කසය',en:'Scissors',em:'✂️',ex:'කපන දෙයකි',clr:'#60a5fa'},
  {si:'ගඟ',en:'River',em:'🌊',ex:'ජලය ගලා බසී',clr:'#38bdf8'},
  {si:'පය',en:'Leg',em:'🦵',ex:'ශරීරයේ කොටසකි',clr:'#a3e635'},
  {si:'ගස',en:'Tree',em:'🌳',ex:'ශාකයකි',clr:'#4ade80'},
  {si:'ගගන',en:'Sky',em:'🌤️',ex:'ඉහළ ඇත',clr:'#7dd3fc'},
  {si:'පහන',en:'Lamp',em:'🪔',ex:'එළිය දෙයි',clr:'#fcd34d'},
  {si:'යහන',en:'Bed',em:'🛏️',ex:'නිදා ගනිමු',clr:'#c084fc'},
  {si:'කහ',en:'Yellow',em:'🟡',ex:'වර්ණයකි',clr:'#fde68a'},
  {si:'සතය',en:'Animal',em:'🐘',ex:'සතෙකු',clr:'#86efac'},
  {si:'පස',en:'Soil',em:'🟤',ex:'භූමිය',clr:'#d97706'},
  {si:'හය',en:'Six',em:'6️⃣',ex:'ගණනකි',clr:'#f472b6'},
  {si:'හත',en:'Seven',em:'7️⃣',ex:'ගණනකි',clr:'#a78bfa'},
  {si:'පහ',en:'Five',em:'5️⃣',ex:'ගණනකි',clr:'#34d399'}
];
var li=0,seen=new Set(),mi=0,ms=0,ma=false,mo=[],qi=0,qs2=0,qa=false,qo=[];
function showTab(t){
  ['lrn','mch','qz'].forEach(function(v){
    document.getElementById('v-'+v).style.display='none';
    var m={'lrn':'lrn','mch':'mch','qz':'qz'};
    document.getElementById('t-'+v).className='tab '+m[v]+(v===t?' on':'');
  });
  document.getElementById('v-'+t).style.display='flex';
  document.getElementById('v-'+t).style.flexDirection='column';
  if(t==='mch'&&mo.length===0)startMatch();
  if(t==='qz'&&qo.length===0)startQuiz();
  tick();
}
function tick(){var n=new Date();document.getElementById('stime').textContent=n.getHours()+':'+(n.getMinutes()<10?'0':'')+n.getMinutes();}
function rl(){
  var d=W[li];seen.add(li);
  document.getElementById('lem').textContent=d.em;
  document.getElementById('lsi').textContent=d.si;
  document.getElementById('lsi').style.color=d.clr;
  document.getElementById('len').textContent=d.en;
  document.getElementById('lex').textContent=d.ex;
  document.getElementById('lidx').textContent=li+1;
  document.getElementById('plbl').textContent=(li+1)+' / 15';
  document.getElementById('seenlbl').textContent='දුටු: '+seen.size;
  document.getElementById('pfill').style.width=(seen.size/15*100)+'%';
  document.getElementById('lprev').disabled=li===0;
  document.getElementById('lnext').disabled=li===14;
  rdots();
}
function rdots(){
  var r=document.getElementById('ldots');r.innerHTML='';
  W.forEach(function(d,i){
    var dt=document.createElement('div');
    dt.className='dot'+(seen.has(i)?' seen':'')+(i===li?' cur':'');
    dt.style.background=i===li?W[i].clr:seen.has(i)?'#3a2a6a':'';
    (function(idx){dt.addEventListener('click',function(){li=idx;rl();});})(i);
    r.appendChild(dt);
  });
}
function lNav(d){li=Math.max(0,Math.min(14,li+d));rl();}
function speakL(){spk(W[li].en,'lspk');}
function spk(t,id){
  if(!window.speechSynthesis)return;
  window.speechSynthesis.cancel();
  var u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=0.85;
  window.speechSynthesis.speak(u);
}
function shuf(a){return a.slice().sort(function(){return Math.random()-0.5;});}
function startMatch(){ms=0;mi=0;ma=false;mo=shuf(W);document.getElementById('msc').textContent='0';rm();}
function rm(){
  ma=false;var d=mo[mi];
  document.getElementById('mrnd').textContent=(mi+1)+'/15';
  document.getElementById('mpic').textContent=d.em;
  var g=document.getElementById('mopts');g.innerHTML='';
  var ch=[d];shuf(W).forEach(function(x){if(ch.length<4&&x.si!==d.si)ch.push(x);});
  shuf(ch).forEach(function(x){
    var b=document.createElement('button');b.className='opt';b.textContent=x.si;
    (function(dd,btn){btn.addEventListener('click',function(){chkM(dd.si===d.si,btn,d);});})(x,b);
    g.appendChild(b);
  });
  document.getElementById('mfb').textContent='පින්තූරය බලා වචනය තෝරන්න!';
  document.getElementById('mfb').className='fb neu';
  document.getElementById('mnxt').disabled=true;
}
function chkM(ok,btn,d){
  if(ma)return;ma=true;
  document.querySelectorAll('#mopts .opt').forEach(function(b){b.style.pointerEvents='none';});
  if(ok){btn.className='opt correct';ms++;document.getElementById('msc').textContent=ms;spawnS('mpcard');spk(d.en,'lspk');document.getElementById('mfb').textContent='✅ නිවැරදි! "'+d.si+'" = '+d.en;document.getElementById('mfb').className='fb good';}
  else{btn.className='opt wrong';document.querySelectorAll('#mopts .opt').forEach(function(b){if(b.textContent===d.si)b.className='opt reveal';});document.getElementById('mfb').textContent='❌ නිවැරදි: "'+d.si+'"';document.getElementById('mfb').className='fb bad';}
  document.getElementById('mnxt').disabled=false;
}
function nextMatch(){mi++;if(mi>=15){document.getElementById('mfb').textContent=(ms===15?'🏆 සියල්ල නිවැරදි!':ms>=10?'🌟 ඉතා හොඳයි!':'💪 නැවත උත්සාහ!')+' '+ms+'/15';document.getElementById('mfb').className='fb good';document.getElementById('mnxt').textContent='නැවත ▶';document.getElementById('mnxt').onclick=function(){document.getElementById('mnxt').textContent='ඊළඟ ➜';document.getElementById('mnxt').onclick=nextMatch;startMatch();};}else rm();}
function startQuiz(){qs2=0;qi=0;qa=false;qo=shuf(W);document.getElementById('qsc').textContent='0';rq();}
function rq(){
  qa=false;var d=qo[qi];
  document.getElementById('qrnd').textContent=(qi+1)+'/15';
  var isW=Math.random()>0.5;
  if(isW){
    document.getElementById('qpic').textContent='';document.getElementById('qpic').style.display='none';
    document.getElementById('qword').textContent=d.si;document.getElementById('qword').style.color=d.clr;
    document.getElementById('qprompt').textContent='මේ වචනට ගැළපෙන පින්තූරය කුමක්ද?';
  } else {
    document.getElementById('qpic').style.display='block';document.getElementById('qpic').textContent=d.em;
    document.getElementById('qword').textContent='';
    document.getElementById('qprompt').textContent='මේ පින්තූරයට ගැළපෙන වචනය කුමක්ද?';
  }
  var g=document.getElementById('qopts');g.innerHTML='';
  var ch=[d];shuf(W).forEach(function(x){if(ch.length<4&&x.si!==d.si)ch.push(x);});
  shuf(ch).forEach(function(x){
    var b=document.createElement('button');b.className='opt';
    b.textContent=isW?x.em:x.si;b.style.fontSize=isW?'30px':'20px';
    (function(dd,btn){btn.addEventListener('click',function(){chkQ(dd.si===d.si,btn,d,isW);});})(x,b);
    g.appendChild(b);
  });
  document.getElementById('qfb').textContent='නිවැරදි පිළිතුර තෝරන්න!';
  document.getElementById('qfb').className='fb neu';
  document.getElementById('qnxt').disabled=true;
}
function chkQ(ok,btn,d,isW){
  if(qa)return;qa=true;
  document.querySelectorAll('#qopts .opt').forEach(function(b){b.style.pointerEvents='none';});
  var cv=isW?d.em:d.si;
  if(ok){btn.className='opt correct';qs2++;document.getElementById('qsc').textContent=qs2;spawnS('qcard');spk(d.en,'lspk');document.getElementById('qfb').textContent='✅ නිවැරදි! "'+d.si+'" '+d.em;document.getElementById('qfb').className='fb good';}
  else{btn.className='opt wrong';document.querySelectorAll('#qopts .opt').forEach(function(b){if(b.textContent===cv)b.className='opt reveal';});document.getElementById('qfb').textContent='❌ නිවැරදි: "'+d.si+'" '+d.em;document.getElementById('qfb').className='fb bad';}
  document.getElementById('qnxt').disabled=false;
}
function nextQuiz(){qi++;if(qi>=15){document.getElementById('qfb').textContent=(qs2===15?'🏆 Perfect!':qs2>=10?'🌟 ඉතා හොඳයි!':'💪 නැවත උත්සාහ!')+' '+qs2+'/15';document.getElementById('qfb').className='fb good';document.getElementById('qnxt').textContent='නැවත 🔄';document.getElementById('qnxt').onclick=function(){document.getElementById('qnxt').textContent='ඊළඟ ➜';document.getElementById('qnxt').onclick=nextQuiz;startQuiz();};}else rq();}
function spawnS(id){
  var c=document.getElementById(id);
  ['🎉','⭐','✨','💫'].forEach(function(e,i){setTimeout(function(){var el=document.createElement('span');el.className='spark';el.textContent=e;el.style.left=Math.random()*80+10+'%';el.style.top='8px';c.appendChild(el);setTimeout(function(){if(el.parentNode)el.parentNode.removeChild(el);},850);},i*100);});
}
tick();rl();
</script>
</body>
</html>
