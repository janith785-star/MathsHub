<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>පෙර පාසල් - වාහන</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family:'Nunito',sans-serif;
  background:linear-gradient(160deg,#fff9c4,#fce4ec,#e1f5fe,#f3e5f5);
  min-height:100vh;
  overflow-x:hidden;
}
.topbar {
  display:flex;
  align-items:center;
  padding:12px 16px;
  background:rgba(255,255,255,0.8);
  backdrop-filter:blur(10px);
  border-bottom:3px solid #FFD700;
  position:sticky;
  top:0;
  z-index:100;
}
.back-btn {
  text-decoration:none;
  background:linear-gradient(135deg,#FF6B35,#FF1744);
  color:white;
  padding:8px 16px;
  border-radius:20px;
  font-size:0.85em;
  font-weight:700;
  box-shadow:0 4px 12px rgba(255,107,53,0.4);
}
.topbar h2 {
  font-family:'Fredoka One',cursive;
  font-size:1.3em;
  color:#333;
  margin:0 auto;
  padding-right:70px;
}

.container { padding:16px; max-width:480px; margin:0 auto; }

.section-title {
  font-family:'Fredoka One',cursive;
  font-size:1.6em;
  text-align:center;
  margin:16px 0 12px;
  color:#333;
  text-shadow:2px 2px 0 rgba(0,0,0,0.05);
}
.section-title span { font-size:1.2em; }

.vehicles-grid {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
  margin-bottom:20px;
}
.vehicle-card {
  background:white;
  border-radius:24px;
  padding:20px 12px;
  text-align:center;
  cursor:pointer;
  box-shadow:0 8px 24px rgba(0,0,0,0.1);
  border:3px solid transparent;
  transition:all 0.3s cubic-bezier(0.175,0.885,0.32,1.275);
  position:relative;
  overflow:hidden;
}
.vehicle-card::after {
  content:'';
  position:absolute;
  inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,0.6),transparent);
  pointer-events:none;
}
.vehicle-card:hover, .vehicle-card.active {
  transform:scale(1.06) translateY(-4px);
  border-color:#FFD700;
  box-shadow:0 16px 40px rgba(255,215,0,0.3);
}
.vehicle-card.land { background:linear-gradient(135deg,#fff3e0,#ffe0b2); }
.vehicle-card.water { background:linear-gradient(135deg,#e3f2fd,#bbdefb); }
.vehicle-card.air { background:linear-gradient(135deg,#f3e5f5,#e1bee7); }

.v-emoji {
  font-size:58px;
  display:block;
  animation:wobble 3s ease-in-out infinite;
  filter:drop-shadow(0 4px 8px rgba(0,0,0,0.15));
}
@keyframes wobble {
  0%,100%{transform:rotate(-8deg) scale(1);}
  50%{transform:rotate(8deg) scale(1.1);}
}
.v-emoji.fly { animation:fly 3s ease-in-out infinite; }
@keyframes fly {
  0%,100%{transform:translateY(0) rotate(-5deg);}
  50%{transform:translateY(-10px) rotate(5deg);}
}
.v-emoji.sail { animation:sail 4s ease-in-out infinite; }
@keyframes sail {
  0%,100%{transform:rotate(-3deg);}
  50%{transform:rotate(3deg) translateX(5px);}
}

.v-name {
  font-family:'Fredoka One',cursive;
  font-size:1.2em;
  color:#333;
  display:block;
  margin-top:8px;
}
.v-type-tag {
  display:inline-block;
  padding:3px 10px;
  border-radius:20px;
  font-size:0.7em;
  font-weight:700;
  margin-top:5px;
}
.land-tag { background:#FF6B35; color:white; }
.water-tag { background:#0288D1; color:white; }
.air-tag { background:#9C27B0; color:white; }

.section-divider {
  display:flex;
  align-items:center;
  gap:10px;
  margin:8px 0;
}
.section-divider div {
  flex:1;
  height:2px;
  background:linear-gradient(90deg,transparent,#ddd,transparent);
}

/* QUIZ */
.quiz-section {
  background:white;
  border-radius:24px;
  padding:20px;
  box-shadow:0 8px 24px rgba(0,0,0,0.1);
  margin-bottom:20px;
}
.quiz-title {
  font-family:'Fredoka One',cursive;
  font-size:1.4em;
  color:#333;
  text-align:center;
  margin-bottom:16px;
}
.quiz-question {
  text-align:center;
  font-size:1em;
  font-weight:700;
  color:#555;
  margin-bottom:12px;
  line-height:1.5;
}
.quiz-emoji-big {
  font-size:90px;
  text-align:center;
  display:block;
  margin:8px 0;
  filter:drop-shadow(0 6px 12px rgba(0,0,0,0.2));
}
.quiz-options {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:12px;
}
.quiz-btn {
  padding:14px 8px;
  border:3px solid #eee;
  border-radius:18px;
  background:white;
  font-family:'Fredoka One',cursive;
  font-size:1em;
  cursor:pointer;
  transition:all 0.3s;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
}
.quiz-btn:hover { transform:scale(1.05); border-color:#FFD700; }
.quiz-btn.correct { background:#E8F5E9; border-color:#4CAF50; animation:pulse 0.5s; }
.quiz-btn.wrong { background:#FFEBEE; border-color:#F44336; animation:shake 0.4s; }
@keyframes pulse { 0%,100%{transform:scale(1);}50%{transform:scale(1.1);} }
@keyframes shake { 0%,100%{transform:translateX(0);}25%{transform:translateX(-8px);}75%{transform:translateX(8px);} }

.feedback {
  text-align:center;
  padding:12px;
  border-radius:16px;
  font-family:'Fredoka One',cursive;
  font-size:1.2em;
  margin-top:12px;
  display:none;
}
.feedback.show { display:block; animation:fadeIn 0.4s; }
.feedback.good { background:#E8F5E9; color:#2E7D32; }
.feedback.bad { background:#FFEBEE; color:#C62828; }
@keyframes fadeIn{from{opacity:0;transform:scale(0.8);}to{opacity:1;transform:scale(1);}}

.next-btn {
  display:block;
  width:100%;
  margin-top:12px;
  padding:14px;
  background:linear-gradient(135deg,#4CAF50,#2E7D32);
  color:white;
  border:none;
  border-radius:18px;
  font-family:'Fredoka One',cursive;
  font-size:1.2em;
  cursor:pointer;
  transition:all 0.3s;
  display:none;
}
.next-btn.show { display:block; }
.next-btn:hover { transform:scale(1.03); box-shadow:0 8px 20px rgba(76,175,80,0.4); }

.score-bar {
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#f5f5f5;
  border-radius:16px;
  padding:10px 16px;
  margin-bottom:12px;
}
.score-label { font-size:0.85em; color:#777; font-weight:700; }
.score-num { font-family:'Fredoka One',cursive; font-size:1.3em; color:#FF6B35; }

.confetti-emoji {
  position:fixed;
  pointer-events:none;
  font-size:2em;
  animation:confettiFall 1.5s ease-in forwards;
  z-index:999;
}
@keyframes confettiFall {
  0%{opacity:1;transform:translateY(-20px) rotate(0deg);}
  100%{opacity:0;transform:translateY(100vh) rotate(720deg);}
}
</style>
</head>
<body>

<div class="topbar">
  <a href="index.html" class="back-btn">← ආපසු</a>
  <h2>🍼 පෙර පාසල්</h2>
</div>

<div class="container">

  <!-- Land Vehicles -->
  <div class="section-title"><span>🛣️</span> ගොඩබිමේ යන වාහන</div>
  <div class="vehicles-grid">
    <div class="vehicle-card land" onclick="speakName('පාපැදිය')">
      <span class="v-emoji">🚲</span>
      <span class="v-name">පාපැදිය</span>
      <span class="v-type-tag land-tag">ගොඩබිම</span>
    </div>
    <div class="vehicle-card land" onclick="speakName('කාර් එක')">
      <span class="v-emoji">🚗</span>
      <span class="v-name">කාර් එක</span>
      <span class="v-type-tag land-tag">ගොඩබිම</span>
    </div>
    <div class="vehicle-card land" onclick="speakName('බස් රථය')">
      <span class="v-emoji">🚌</span>
      <span class="v-name">බස් රථය</span>
      <span class="v-type-tag land-tag">ගොඩබිම</span>
    </div>
    <div class="vehicle-card land" onclick="speakName('ලොරි රථය')">
      <span class="v-emoji">🚛</span>
      <span class="v-name">ලොරි රථය</span>
      <span class="v-type-tag land-tag">ගොඩබිම</span>
    </div>
  </div>

  <div class="section-divider"><div></div><span>🌊</span><div></div></div>

  <!-- Water Vehicles -->
  <div class="section-title"><span>⛵</span> ජලයේ යන වාහන</div>
  <div class="vehicles-grid">
    <div class="vehicle-card water" onclick="speakName('ඔරුව')">
      <span class="v-emoji sail">🛶</span>
      <span class="v-name">ඔරුව</span>
      <span class="v-type-tag water-tag">ජලය</span>
    </div>
    <div class="vehicle-card water" onclick="speakName('බෝට්ටුව')">
      <span class="v-emoji sail">⛵</span>
      <span class="v-name">බෝට්ටුව</span>
      <span class="v-type-tag water-tag">ජලය</span>
    </div>
  </div>

  <div class="section-divider"><div></div><span>✈️</span><div></div></div>

  <!-- Air Vehicles -->
  <div class="section-title"><span>✈️</span> ගුවනේ යන වාහන</div>
  <div class="vehicles-grid">
    <div class="vehicle-card air" onclick="speakName('ගුවන් යානය')">
      <span class="v-emoji fly">✈️</span>
      <span class="v-name">ගුවන් යානය</span>
      <span class="v-type-tag air-tag">ගුවන</span>
    </div>
    <div class="vehicle-card air" onclick="speakName('හෙලිකොප්ටරය')">
      <span class="v-emoji fly">🚁</span>
      <span class="v-name">හෙලිකොප්ටරය</span>
      <span class="v-type-tag air-tag">ගුවන</span>
    </div>
  </div>

  <!-- Quiz -->
  <div class="quiz-section">
    <div class="quiz-title">🎯 ප්‍රශ්නාවලිය</div>
    <div class="score-bar">
      <span class="score-label">ලකුණු:</span>
      <span class="score-num" id="scoreDisplay">0 / 0</span>
    </div>
    <div class="quiz-question" id="quizQ">මෙය කුමන වාහනයද?</div>
    <span class="quiz-emoji-big" id="quizEmoji">🚗</span>
    <div class="quiz-options" id="quizOptions"></div>
    <div class="feedback" id="feedback"></div>
    <button class="next-btn" id="nextBtn" onclick="nextQuestion()">ඊළඟ ප්‍රශ්නය →</button>
  </div>

</div>

<script>
const vehicles = [
  {emoji:'🚲', name:'පාපැදිය', type:'land'},
  {emoji:'🚗', name:'කාර් එක', type:'land'},
  {emoji:'🚌', name:'බස් රථය', type:'land'},
  {emoji:'🚛', name:'ලොරි රථය', type:'land'},
  {emoji:'🛶', name:'ඔරුව', type:'water'},
  {emoji:'⛵', name:'බෝට්ටුව', type:'water'},
  {emoji:'✈️', name:'ගුවන් යානය', type:'air'},
  {emoji:'🚁', name:'හෙලිකොප්ටරය', type:'air'},
];

let score=0, total=0, current=null, answered=false;

function shuffleArr(arr){ return [...arr].sort(()=>Math.random()-0.5); }

function nextQuestion(){
  answered=false;
  document.getElementById('feedback').className='feedback';
  document.getElementById('nextBtn').className='next-btn';
  document.querySelectorAll('.quiz-btn').forEach(b=>{b.className='quiz-btn';b.disabled=false;});

  current = vehicles[Math.floor(Math.random()*vehicles.length)];
  document.getElementById('quizEmoji').textContent=current.emoji;
  document.getElementById('quizQ').textContent='මෙය කුමන වාහනයද?';

  const opts = shuffleArr(vehicles).slice(0,3);
  if(!opts.find(v=>v.name===current.name)) opts[0]=current;
  const finalOpts = shuffleArr(opts);

  const container=document.getElementById('quizOptions');
  container.innerHTML='';
  finalOpts.forEach(v=>{
    const btn=document.createElement('button');
    btn.className='quiz-btn';
    btn.innerHTML=`<span style="font-size:1.6em">${v.emoji}</span>${v.name}`;
    btn.onclick=()=>checkAnswer(v.name, btn);
    container.appendChild(btn);
  });
}

function checkAnswer(name, btn){
  if(answered)return;
  answered=true;
  total++;
  const fb=document.getElementById('feedback');
  if(name===current.name){
    score++;
    btn.className='quiz-btn correct';
    fb.textContent='🎉 ඉතා දක්ෂයි! සුපිරි!';
    fb.className='feedback show good';
    spawnConfetti();
  } else {
    btn.className='quiz-btn wrong';
    fb.textContent=`නැවත උත්සාහ කරන්න! නිවැරදි පිළිතුර: ${current.emoji} ${current.name}`;
    fb.className='feedback show bad';
  }
  document.getElementById('scoreDisplay').textContent=`${score} / ${total}`;
  document.querySelectorAll('.quiz-btn').forEach(b=>b.disabled=true);
  document.getElementById('nextBtn').className='next-btn show';
}

function spawnConfetti(){
  const emojis=['🎉','⭐','🌟','💫','🎊'];
  for(let i=0;i<10;i++){
    setTimeout(()=>{
      const el=document.createElement('div');
      el.className='confetti-emoji';
      el.textContent=emojis[Math.floor(Math.random()*emojis.length)];
      el.style.left=Math.random()*100+'vw';
      el.style.top='0';
      el.style.animationDuration=(Math.random()*1+1)+'s';
      document.body.appendChild(el);
      setTimeout(()=>el.remove(),2000);
    },i*80);
  }
}

function speakName(name){
  if('speechSynthesis' in window){
    const u=new SpeechSynthesisUtterance(name);
    u.lang='si-LK';
    window.speechSynthesis.speak(u);
  }
}

nextQuestion();
</script>
</body>
</html>
